name: Rescheduling benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Smoke tests or full benchmarks, including official and generated ITC data"
        type: choice
        options:
          - smoke
          - full
        default: smoke
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  smoke:
    if: inputs.suite == 'smoke'
    runs-on: windows-2025
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Record environment
        run: |
          mkdir -p benchmark-metadata experiments/results
          python -m pip freeze > benchmark-metadata/dependencies.txt
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          import psutil
          data = dict(commit=os.environ["GITHUB_SHA"], os=platform.platform(),
                      python=platform.python_version(), cpu=platform.processor(),
                      logical_cpus=psutil.cpu_count(), ram_bytes=psutil.virtual_memory().total,
                      runner_image=os.environ.get("ImageVersion"),
                      run_id=os.environ["GITHUB_RUN_ID"],
                      run_attempt=os.environ["GITHUB_RUN_ATTEMPT"])
          Path("benchmark-metadata/environment.json").write_text(
              json.dumps(data, indent=2), encoding="utf-8")
          PY

      - name: Unit and paper tests
        timeout-minutes: 15
        run: |
          python -m pytest -m "not perf" -v --durations=0 \
            --junitxml=experiments/results/unit-tests.xml \
            2>&1 | tee benchmark-metadata/unit-tests.log

      - name: Fetch official ITC cases and generate ITC-style smoke inputs
        timeout-minutes: 45
        run: |
          python -m experiments.itc_data --synthetic s m \
            2>&1 | tee benchmark-metadata/itc-data.log

      - name: Performance smoke tests
        timeout-minutes: 120
        run: |
          python -m pytest -m perf -v --durations=0 \
            --junitxml=experiments/results/performance-tests.xml \
            2>&1 | tee benchmark-metadata/performance-tests.log

      - name: Save measurements, reports, logs and starting timetables
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            experiments/results/
            experiments/instances/
            experiments/itc/
            benchmark-metadata/
          retention-days: 7

  prepare:
    if: inputs.suite == 'full'
    runs-on: windows-2025
    timeout-minutes: 330
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_csvs: ${{ steps.plan.outputs.expected_csvs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch official ITC cases and generate ITC-style full inputs
        timeout-minutes: 90
        run: |
          mkdir -p benchmark-metadata
          python -m experiments.itc_data --synthetic s m l \
            2>&1 | tee benchmark-metadata/itc-data.log

      - name: Prepare shared timetables and build the benchmark matrix
        id: plan
        timeout-minutes: 210
        run: |
          mkdir -p benchmark-metadata
          python -m pip freeze > benchmark-metadata/prepare-dependencies.txt
          python - <<'PY' 2>&1 | tee benchmark-metadata/prepare.log
          import json, os, re
          from pathlib import Path
          from experiments.generator import itc_sizes, load_or_generate, sample_regulation
          from experiments.scenarios import ALL, build
          cache = Path("experiments/instances")
          jobs, omitted = [], []
          for size, count in (("S", 3), ("M", 3), ("L", 1), ("XL", 1)):
              for seed in range(1, count + 1):
                  inst, _ = load_or_generate(size, seed, cache, workers=2)
                  print(f"Prepared {size}-{seed}: {len(inst.lessons)} lessons", flush=True)
              jobs.extend(dict(size=size, scenario=sid) for sid in ALL)
          manifest = json.loads(Path("benchmark-metadata/itc-manifest.json").read_text(encoding="utf-8"))
          origins = {d["size"]: d["kind"] for d in manifest["datasets"]}
          ready_kinds = set()
          for size in itc_sizes():
              if not re.fullmatch(r"itc-[A-Za-z0-9][A-Za-z0-9._-]*", size):
                  raise ValueError(f"Unsupported XML filename: {size}")
              try:
                  inst, x0 = load_or_generate(size, 1, cache, workers=2)
              except RuntimeError as exc:
                  omitted.append(dict(size=size, stage="initial_timetable", reason=str(exc)))
                  print(f"ITC preparation limitation: {size}: {exc}", flush=True)
                  continue
              ready_kinds.add(origins[size])
              _, locks = sample_regulation(inst, 1, 0.2, 0.1)
              for sid in ("H1", "H5", "H9"):
                  try:
                      build(sid, inst, x0, 1, locks)
                  except RuntimeError as exc:
                      omitted.append(dict(size=size, scenario=sid, stage="scenario", reason=str(exc)))
                      print(f"ITC scenario limitation: {size}/{sid}: {exc}", flush=True)
                      continue
                  jobs.append(dict(size=size, scenario=sid))
              print(f"Prepared {size}: {len(inst.lessons)} lessons", flush=True)
          plan = dict(jobs=jobs, omitted=omitted)
          Path("benchmark-metadata/benchmark-plan.json").write_text(
              json.dumps(plan, indent=2), encoding="utf-8")
          required = {"official_itc2019_test_instance", "synthetic_itc2019_style"}
          if not required <= ready_kinds:
              raise RuntimeError(f"ITC coverage incomplete: prepared dataset kinds are {sorted(ready_kinds)}")
          if len(jobs) > 256:
              raise RuntimeError(f"{len(jobs)} jobs exceed GitHub's 256-job matrix limit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(dict(include=jobs), separators=(",", ":")) + "\n")
              output.write(f"expected_csvs={len(jobs)}\n")
          print(f"Planned {len(jobs)} benchmark jobs; {len(omitted)} recorded limitations", flush=True)
          PY

      - name: Save shared timetables, XML inputs and dataset manifests
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-inputs
          path: |
            experiments/instances/
            experiments/itc/
            benchmark-metadata/itc-manifest.json
            benchmark-metadata/benchmark-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Save generation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instance-generation-log
          path: benchmark-metadata/
          retention-days: 7

  benchmark:
    needs: prepare
    name: "${{ matrix.size }} / ${{ matrix.scenario }}"
    runs-on: windows-2025
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      BENCH_SIZE: ${{ matrix.size }}
      BENCH_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download shared timetables, XML inputs and dataset manifests
        uses: actions/download-artifact@v8
        with:
          name: benchmark-inputs
          path: .

      - name: Record environment and verify shared instances
        run: |
          mkdir -p benchmark-metadata
          python -m pip freeze > benchmark-metadata/dependencies.txt
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          import psutil
          size = os.environ["BENCH_SIZE"]
          count = 3 if size in ("S", "M") else 1
          hashes = {}
          for seed in range(1, count + 1):
              filename = f"{size}.json" if size.startswith("itc-") else f"{size}-{seed}.json"
              path = Path("experiments/instances") / filename
              hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          data = dict(commit=os.environ["GITHUB_SHA"], os=platform.platform(),
                      python=platform.python_version(), cpu=platform.processor(),
                      logical_cpus=psutil.cpu_count(), ram_bytes=psutil.virtual_memory().total,
                      runner_image=os.environ.get("ImageVersion"),
                      run_id=os.environ["GITHUB_RUN_ID"],
                      run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                      size=size, scenario=os.environ["BENCH_SCENARIO"],
                      solver_workers=2, instance_sha256=hashes)
          Path("benchmark-metadata/environment.json").write_text(
              json.dumps(data, indent=2), encoding="utf-8")
          PY

      - name: Run all methods sequentially on this VM
        # A step timeout leaves time for the always() artifact upload.
        timeout-minutes: 300
        run: |
          python -m experiments.perf \
            --sizes "$BENCH_SIZE" \
            --scenarios "$BENCH_SCENARIO" \
            --solver-workers 2 \
            --time-limit 30 \
            --explain-time 10 \
            --ref-time 300 \
            --mem-limit-mb 3072 \
            --out "experiments/results/perf-${BENCH_SIZE}-${BENCH_SCENARIO}.csv" \
            --report-dir "experiments/results/report-${BENCH_SIZE}-${BENCH_SCENARIO}" \
            2>&1 | tee benchmark-metadata/benchmark.log

      - name: Save this job's results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.size }}-${{ matrix.scenario }}
          path: |
            experiments/results/
            benchmark-metadata/
          retention-days: 7

  report:
    needs: [prepare, benchmark]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EXPECTED_CSVS: ${{ needs.prepare.outputs.expected_csvs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download all completed benchmark results
        uses: actions/download-artifact@v8
        with:
          pattern: perf-*
          path: downloaded-results/

      - name: Include shared timetables, XML inputs and dataset manifests
        uses: actions/download-artifact@v8
        with:
          name: benchmark-inputs
          path: .

      - name: Combine CSVs and retain environment records
        run: |
          python - <<'PY'
          import csv, json, os, shutil
          from pathlib import Path
          from experiments.perf import FIELDS
          files = sorted(Path("downloaded-results").rglob("perf-*.csv"))
          expected = int(os.environ["EXPECTED_CSVS"])
          plan = json.loads(Path("benchmark-metadata/benchmark-plan.json").read_text(encoding="utf-8"))
          wanted = {f"perf-{j['size']}-{j['scenario']}.csv" for j in plan["jobs"]}
          if len(files) != expected or {p.name for p in files} != wanted:
              raise RuntimeError(f"Expected the {expected} planned result CSVs; found {len(files)}")
          out = Path("experiments/results/perf.csv")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=FIELDS)
              writer.writeheader()
              for path in files:
                  with path.open(newline="", encoding="utf-8") as source:
                      reader = csv.DictReader(source)
                      if reader.fieldnames != FIELDS:
                          raise RuntimeError(f"Unexpected CSV schema: {path}")
                      rows = list(reader)
                  if not rows:
                      raise RuntimeError(f"Empty results: {path}")
                  writer.writerows(rows)
          for folder in sorted(Path("downloaded-results").glob("perf-*")):
              source = folder / "benchmark-metadata"
              if source.exists():
                  shutil.copytree(source, Path("benchmark-metadata") / folder.name)
          print(f"Combined {len(files)} files into {out}")
          PY

      - name: Generate the combined report and charts
        run: |
          python -m experiments.perf_report experiments/results/perf.csv \
            --out experiments/results/perf_report

      - name: Save combined results, charts, inputs and environment records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-results
          path: |
            experiments/results/
            experiments/instances/
            experiments/itc/
            benchmark-metadata/
          retention-days: 7
